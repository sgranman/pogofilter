# PoGoFilter is a static site: no backend, no cookies, no logs worth keeping.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Players' filters live in the URL fragment and localStorage, never in a
    # request, but there's no reason to keep visitor IPs either.
    access_log off;
    server_tokens off;

    include mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Production mounts the optional stats routes here (deploy/nginx-stats.conf).
    # With no file present this includes nothing and the site stays static.
    include /etc/nginx/snippets/stats*.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build output never changes under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and app shell must revalidate so updates reach phones.
    location ~ ^/(sw\.js|workbox-.*\.js|index\.html|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
