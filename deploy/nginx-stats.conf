# Mounted at /etc/nginx/snippets/stats.conf by deploy/docker-compose.yml only.
# Forwards the optional stats routes to the pogofilter-stats container.
# The upstream is a variable so nginx resolves it per request (Docker DNS)
# and still starts if the stats container is down.

location = /api/e {
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 1k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $stats http://pogofilter-stats:8090;
    proxy_pass $stats;
}

location = /admin {
    return 301 /admin/;
}

location ^~ /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $stats http://pogofilter-stats:8090;
    proxy_pass $stats;
}
