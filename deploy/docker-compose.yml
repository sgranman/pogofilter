# The production stack on sgran-ubuntu. The repo is checked out at
# ~/docker/pogofilter and deploy/update.sh runs
#   docker compose -f deploy/docker-compose.yml up -d --build
# whenever origin/main moves. The image is the repo-root Dockerfile, which
# runs the tests before building, so a failing commit never goes live.
#
# Reachable only through the cloudflared container on the shared `web`
# network. Public Hostname route (Zero Trust dashboard):
#   pogofilter.sgran.net -> http://pogofilter:8080
name: pogofilter

services:
  pogofilter:
    build: ..
    image: pogofilter
    container_name: pogofilter
    restart: unless-stopped
    # Static files only: nothing to write but nginx's scratch space.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  web:
    external: true
